# ══════════════════════════════════════════════════════════════════════════
#  개발계(AI 플랫폼 K8s) 배포 값
# ══════════════════════════════════════════════════════════════════════════
#  투라코 플랫폼의 기존 서비스 차트(data_HelmChart/{stage}/{service})와 같은 모양을
#  따르되, 여기서는 -@placeholder@- 토큰 대신 실제 값을 넣는다.
#  이 차트를 투라코 HelmChart 레포에 등록할 때는 아래 값이 그 토큰으로 치환된다.

namespace: data-pipeline

# 투라코 서비스명. 이미지·Service·Deployment 이름이 모두 여기에 맞춰진다.
serviceName: borami-xvarm-broker-1joiuorqhl

image:
  # Jenkinsfile 이 $IMAGE_REPO_NAME:$ARGO_APPLICATION-$COMMIT_ID 로 푸시한다.
  repository: registry.turacocloud.com/kcais/borami-xvarm-broker-1joiuorqhl
  tag: latest
  pullPolicy: Always
  pullSecret: regsecret

# ⚠ 반드시 1 이다. HPA 도 두지 않는다.
#
#   브로커는 추출 작업 상태(requestId → RUNNING/DONE/파일경로)를 메모리에 들고 있다.
#   파드가 둘이면 POST 를 받은 파드와 GET 상태조회를 받는 파드가 달라져
#   방금 접수한 작업이 404 로 보인다. 상태를 공유하려면 DB 나 캐시가 필요한데,
#   운영 배포지인 보라미 서버에 스키마를 하나 더 요구하게 되어 배포·보안심사
#   부담만 는다. 그래서 단일 인스턴스를 전제로 설계했다.
#
#   부하 문제가 생기면 수평 확장이 아니라 XVARM 호출 스레드 풀을 키우는 쪽이 맞다.
replicas: 1

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  protocol: TCP

container:
  # Dockerfile 의 EXPOSE, application-dev.yml 의 server.port 와 반드시 같아야 한다.
  port: 8080

# XVARM 이 파일을 떨궈 놓는 디렉터리. 개발계에서는 DUMMY 어댑터가 여기에 만든다.
#
# voice-collector 의 수신 PVC 와 같은 볼륨을 보게 하면 ESB 구간 없이 개발계 E2E 가 돈다.
#   · 같은 볼륨을 쓰려면  existingClaim 에 voice-collector 의 PVC 이름을 적고
#     mountPath 를 그 쪽 수신 경로(/k8s/voice_raw/meet)에 맞춘다.
#   · 별도 볼륨으로 두려면 existingClaim 을 비우고 아래 값으로 새로 만든다.
pvc:
  existingClaim: ""
  name: pvc-borami-xvarm-broker-1joiuorqhl
  storageClass: nfs-client
  accessMode: ReadWriteMany
  size: 5Gi
  mountPath: /k8s/xvarm_out

# 파드에 주입할 설정. ConfigMap 으로 만들어 envFrom 으로 붙인다.
config:
  # ⚠ 이 값은 이미지가 어떤 프로파일로 구워졌는지에 따라 무시될 수 있다.
  #   Dockerfile 이 JAVA_OPTS 에 -Dspring.profiles.active=${SPRING_PROFILE} 를 박아 넣고,
  #   시스템 프로퍼티는 환경변수보다 우선한다. 즉 젠킨스가 SPRING_PROFILES_ACTIVE=default 로
  #   이미지를 구웠다면 여기서 dev 를 줘도 default 로 뜬다 — 에러 없이 설정만 어긋난다.
  #   젠킨스 잡의 SPRING_PROFILES_ACTIVE 파라미터를 dev 로 맞춰야 한다.
  SPRING_PROFILES_ACTIVE: "dev"
  SERVER_PORT: "8080"
  # DUMMY — 개발계에는 XVARM 솔루션이 없다. 실연동 사양 확정(계획서 Q3) 전까지 유지.
  BROKER_XVARM_MODE: "DUMMY"
  BROKER_XVARM_ENDPOINT: ""
  BROKER_OUTPUT_DIR: "/k8s/xvarm_out"
  BROKER_DELAY_MS: "1500"
  BROKER_AUDIO_SEC: "2"
  BROKER_JOB_RETENTION_MIN: "60"
  LOG_LEVEL: "DEBUG"
  TZ: "Asia/Seoul"

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

# 브로커에는 actuator 를 넣지 않았다(운영 배포지 의존성 최소화).
# 그래서 probe 는 HTTP 헬스엔드포인트가 아니라 tcpSocket 을 쓴다 —
# 투라코의 기존 서비스 차트도 같은 방식이다.
probe:
  startup:
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 36
  readiness:
    periodSeconds: 5
    timeoutSeconds: 5
  liveness:
    periodSeconds: 5
    timeoutSeconds: 5

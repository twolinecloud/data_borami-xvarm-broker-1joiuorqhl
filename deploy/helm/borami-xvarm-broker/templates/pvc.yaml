{{- /*
  voice-collector 의 PVC 를 함께 쓰는 구성이면(values.pvc.existingClaim 설정)
  여기서 PVC 를 새로 만들지 않는다. 같은 이름의 PVC 를 두 차트가 각각 만들려 하면
  ArgoCD 가 소유권 충돌로 계속 OutOfSync 를 낸다.
*/ -}}
{{- if not .Values.pvc.existingClaim }}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ .Values.pvc.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.serviceName }}
spec:
{{- with .Values.pvc.storageClass }}
  storageClassName: {{ . | quote }}
{{- end }}
  accessModes:
    - {{ default "ReadWriteMany" .Values.pvc.accessMode }}
  resources:
    requests:
      storage: {{ default "5Gi" .Values.pvc.size }}
{{- end }}
